name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ido:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:ido
      - run: npm run pack:ido
      - run: npm run smoke:ido:pack
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:ido
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ido-${{ matrix.os }}
          path: |
            .ido-build/tarballs/*.tgz
            .ido-build/screenshots/*.png
          if-no-files-found: ignore
