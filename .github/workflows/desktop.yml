name: Desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/desktop/**"
      - "packages/client/**"
      - "packages/common/**"
      - "packages/common-ui/**"
      - "scripts/build-desktop.mjs"
      - "scripts/check-desktop-target.cjs"
      - "scripts/desktop-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:ido
      - run: npm run build:desktop
      - run: npm run smoke:desktop
      - run: npm run pack:desktop -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: IDO-Agent-${{ matrix.target }}-${{ matrix.arch }}-unsigned
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
          if-no-files-found: error
